name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um job por camada: o backend roda em SQLite em memoria (nao precisa de MySQL),
# o frontend valida lint e build de producao.
jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      # `requirements-lock.txt` contem as versoes efetivamente testadas localmente.
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      - name: Testes (SQLite em memoria)
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend-jadilson
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend-jadilson/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de producao
        run: npm run build
